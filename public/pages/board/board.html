<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>게시판 - Kaboocam</title>
  <link rel="stylesheet" href="/css/reset.css">
  <link rel="stylesheet" href="/css/theme.css">
  <link rel="stylesheet" href="/css/layout.css">
  <link rel="stylesheet" href="/pages/board/board.css">
</head>
<body>
  <div class="page-wrapper">
    <main class="main-content">
      <div class="container">
        <div class="board-header">
          <h1 class="board-title">게시판</h1>
          
          <!-- Search Bar -->
          <div class="search-bar">
            <input 
              type="search" 
              id="search-input" 
              class="search-input" 
              placeholder="검색어를 입력하세요"
            >
            <button type="button" id="search-btn" class="btn btn-primary">검색</button>
          </div>

          <!-- Tabs -->
          <div class="board-tabs">
            <button class="tab-btn active" data-tab="popular">인기게시판</button>
            <button class="tab-btn" data-tab="free">자유게시판</button>
          </div>
        </div>

        <!-- Posts List -->
        <div class="posts-list" id="posts-list">
          <!-- Posts will be inserted here -->
        </div>

        <!-- Loading Sentinel for Infinite Scroll -->
        <div class="loading-sentinel" id="loading-sentinel">
          <div class="spinner-small"></div>
        </div>

        <!-- End Message -->
        <div class="end-message" id="end-message" style="display: none;">
          더 이상 게시글이 없습니다
        </div>
      </div>
    </main>
  </div>

  <script type="module" src="/js/common.js"></script>
  <script type="module" src="/pages/board/board.js"></script>
</body>
</html>
